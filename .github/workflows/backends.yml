name: Backend compile checks

on:
  pull_request:
    paths:
      - 'src/cuda/**'
      - 'src/cuda_core/**'
      - 'src/core/**'
      - 'src/exec/**'
      - 'src/attn_core/**'
      - 'src/moe_core/**'
      - 'src/ops/**'
      - 'src/inkling2/**'
      - 'include/strix/**'
      - 'apps/inkling2_mini*'
      - 'tests/cuda_core/**'
      - 'tests/inkling2/**'
      - 'src/qwen35/cuda/**'
      - 'src/intel/**'
      - 'src/core/gpu_port.*'
      - 'src/vulkan/**'
      - 'src/metal/**'
      - 'src/session/backend_cpu.cpp'
      - 'tests/gpu_port_host_tests.cpp'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/backends.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cuda:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04@sha256:5dc1bca23d05bd37b011be68ec470c03b403a5da07ec3a86e41af9470e9d0cc6
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: CORE
            targets: strix_cuda_core_kernels strix-cuda-qwen35-decode strix-cuda-qwen35-cohort
          - mode: QWEN
            targets: strix-cuda-qwen-serve strix-cuda-qwen-prefill-service strix-cuda-qwen-logits
          # CORE_ONLY returns before the checkpoint, executor and serving targets exist.
          # Compile the resident include order and the K8 regression fixture in the full tree.
          - mode: INKLING
            targets: strix-inkling2-mini-cuda strix-serve strix-k8c-mix-cuda-fixture
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake g++ git ninja-build python3
      - uses: actions/checkout@v4
      - name: Compile CUDA targets for sm_120
        env:
          CUDA_MODE: ${{ matrix.mode }}
          CUDA_TARGETS: ${{ matrix.targets }}
        run: |
          options=("-DSTRIX_CUDA_${CUDA_MODE}_ONLY=ON")
          if [ "$CUDA_MODE" = INKLING ]; then
            options=(-DSTRIX_CUDA_CORE=ON -DSTRIX_EXEC_CUDA=ON
              -DSTRIX_EXEC_CUDA_ARCHITECTURES=120 -DSTRIX_ENABLE_HIP_RUNTIME=OFF
              -DBUILD_TESTING=ON -DSTRIX_K8C_CUDA_FIXTURE=ON)
          fi
          cmake -S . -B build/backend-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=120 "${options[@]}"
          read -r -a targets <<< "$CUDA_TARGETS"
          cmake --build build/backend-cuda --parallel 2 --target "${targets[@]}"

  intel:
    runs-on: ubuntu-24.04
    # First compile on this toolchain has yet to be observed in CI.
    continue-on-error: true
    container:
      image: intel/oneapi-basekit:2025.3.0-0-devel-ubuntu24.04@sha256:f62000b9049c57fc4022d3694360bc8a5c34ffee1e4726b042b1ed701d561d61
      options: --user root
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake g++ git ninja-build
      - uses: actions/checkout@v4
      - name: Compile the Intel backend and host tests
        run: |
          # The image entrypoint may already have set the environment; setvars.sh then returns non-zero.
          if ! command -v icpx >/dev/null; then set +e; source /opt/intel/oneapi/setvars.sh >/dev/null; set -e; fi
          command -v icpx
          CXX=icpx cmake -S . -B build/backend-intel -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTRIX_BACKEND_INTEL=ON -DSTRIX_ENABLE_HIP_RUNTIME=OFF -DSTRIX_FAMILY_GEMMA4=ON -DBUILD_TESTING=ON
          grep -Fx 'STRIX_INTEL_SYCL_COMPILES:INTERNAL=1' build/backend-intel/CMakeCache.txt
          grep -Fx 'STRIX_INTEL_SYCL_MATRIX_COMPILES:INTERNAL=1' build/backend-intel/CMakeCache.txt
          cmake --build build/backend-intel --target strix_device_intel strix_intel_core \
            strix-intel-backend-host-tests strix-intel-sycl-boundary-tests strix-intel-hy4-host-tests \
            strix-gemma4-decode strix-gemma4-serve strix_gemma4_session_service strix-hy4-ref

  vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and Vulkan headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslang-tools
      - name: Compile Vulkan reference and host tests
        run: |
          cmake -S . -B build/backend-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTRIX_BACKEND_VULKAN=ON -DSTRIX_ENABLE_HIP_RUNTIME=OFF \
            -DSTRIX_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON
          cmake --build build/backend-vulkan --target strix_vulkan_core strix-gpu-port-host-tests
          test -s build/backend-vulkan/strix_vulkan_rms.spv

  metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile Metal reference and host tests
        run: |
          cmake -S . -B build/backend-metal -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTRIX_BACKEND_METAL=ON -DSTRIX_ENABLE_HIP_RUNTIME=OFF \
            -DSTRIX_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON
          cmake --build build/backend-metal --target strix_metal_core strix-gpu-port-host-tests
          xcrun -sdk macosx metal -c src/metal/core/rms_norm.metal -o build/backend-metal/rms_norm.air
