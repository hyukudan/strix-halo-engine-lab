name: Backend compile checks

# A newer push to the same pull request cancels its older run. Non-required (continue-on-error) jobs
# run on relevant PRs (including shared sources), and on every main push.
concurrency:
  group: backends-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/core/**'
      - 'src/exec/**'
      - 'src/attn_core/**'
      - 'src/moe_core/**'
      - 'src/ops/**'
      - 'src/session/**'
      - 'src/serve/**'
      - 'src/spec/**'
      - 'src/vision/**'
      - 'include/strix/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tests/backend_workflow_paths_tests.py'
      - '.github/workflows/backends.yml'
      - '.github/workflows/backend-intel.yml'
      - 'src/cuda/**'
      - 'src/cuda_core/**'
      - 'src/deepseek41/**'
      - 'src/ds41_*'
      - 'src/deepseek41_*'
      - 'apps/cuda_ds41_*'
      - 'tests/cuda/ds41_*'
      - 'src/qwen35/**'
      - 'src/inkling2/**'
      - 'apps/inkling2_mini*'
      - 'tests/cuda_core/**'
      - 'tests/inkling2/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  path-filter-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/backend_workflow_paths_tests.py

  cuda:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04@sha256:5dc1bca23d05bd37b011be68ec470c03b403a5da07ec3a86e41af9470e9d0cc6
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: CORE
            arch: '120'
            targets: strix_cuda_core_kernels strix-cuda-qwen35-decode strix-cuda-qwen35-cohort
          - mode: QWEN
            arch: '120'
            targets: strix-cuda-qwen-serve strix-cuda-qwen-prefill-service strix-cuda-qwen-logits
          - mode: DS41
            arch: '89'
            targets: strix-cuda-ds41-decode strix-cuda-ds41-prefill-service
          # CORE_ONLY returns before the checkpoint, executor and serving targets exist.
          # Compile the resident include order and the K8 regression fixture in the full tree.
          - mode: INKLING
            arch: '120'
            targets: strix-inkling2-mini-cuda strix-serve strix-k8c-mix-cuda-fixture strix-k10c-resident-embedding-fixture strix-mixlat-cuda-fixture strix-moer-cuda-fixture strix-transition-cuda-fixture strix-cuda-decode-transition-tests
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake g++ git ninja-build python3
      - uses: actions/checkout@v4
      - name: Compile CUDA targets for sm_${{ matrix.arch }}
        env:
          CUDA_MODE: ${{ matrix.mode }}
          CUDA_ARCH: ${{ matrix.arch }}
          CUDA_TARGETS: ${{ matrix.targets }}
        run: |
          options=("-DSTRIX_CUDA_${CUDA_MODE}_ONLY=ON")
          if [ "$CUDA_MODE" = INKLING ]; then
            options=(-DSTRIX_CUDA_CORE=ON -DSTRIX_EXEC_CUDA=ON
              -DSTRIX_EXEC_CUDA_ARCHITECTURES=120 -DSTRIX_ENABLE_HIP_RUNTIME=OFF
              -DBUILD_TESTING=ON -DSTRIX_K8C_CUDA_FIXTURE=ON -DSTRIX_K10C_RESIDENT_FIXTURE=ON
                -DSTRIX_MIXLAT_CUDA_FIXTURE=ON -DSTRIX_MOER_CUDA_FIXTURE=ON -DSTRIX_TRANSITION_CUDA_FIXTURE=ON)
          fi
          cmake -S . -B build/backend-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCH" "${options[@]}"
          read -r -a targets <<< "$CUDA_TARGETS"
          cmake --build build/backend-cuda --parallel 2 --target "${targets[@]}"

