name: CI

# Pull requests: a newer push to the same PR cancels its older run; other PRs are never cancelled.
# main (push, nightly, manual): runs queue instead of cancelling, so the newest main commit always
# finishes one FULL run (every job, every test) and refreshes the compiler cache that PRs restore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

jobs:
  # Which jobs a pull request can affect (tools/ci/ci_changes.py). Anything but a pull request runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      hip: ${{ steps.classify.outputs.hip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            # The checked-out merge commit's first parent is the base branch tip.
            python3 -B tools/ci/ci_changes.py --base HEAD^1 --head HEAD | tee -a "$GITHUB_OUTPUT"
          else
            python3 -B tools/ci/ci_changes.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  # Checks that need no build. Always run, including documentation-only pull requests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Benchmark completion-marker regression (CPU-only)
        shell: bash
        run: python3 scripts/bench/moe-grouped/test_buckets.py

      - name: Reject raw NUL bytes in sources
        shell: bash
        run: python3 tools/ci/check_source_bytes.py

      # Common-core rule (AGENTS.md "Shared code first"): counts may only go down, see tools/ci/check_layering.py.
      - name: Layering ratchet
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/ci/test_check_layering.py
          python3 -B tools/ci/check_layering.py

      - name: CI helper tests
        shell: bash
        run: python3 -B tools/ci/test_ci_helpers.py

      # Reads the documentation tree (also a ctest), so a documentation-only change is checked here.
      - name: Environment switch census
        shell: bash
        run: python3 -B tools/env_switch_census.py --check --root .

      - name: Install Python test dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy

      - name: Logit gate tail rule tests
        shell: bash
        run: python3 -B tools/strix-gate/test_tail_rule.py

  host-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: /home/runner/.ccache-host
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      # The option qualification kit tests (ctest) need numpy for the system python3.
      - name: Install ccache and Python test dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache python3-numpy
          python3 -c 'import numpy; print("numpy", numpy.__version__)'
          ccache --version | head -1
          ccache --zero-stats

      # A pull request reads its own newest cache, else main's newest; its saves stay in its own scope.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache-host
          key: ccache-v1-host-${{ runner.os }}-gcc-relwithdebinfo-${{ github.sha }}
          restore-keys: ccache-v1-host-${{ runner.os }}-gcc-relwithdebinfo-

      - name: Configure, build and test core
        shell: bash
        run: |
          set -euo pipefail
          {
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
            cmake --build build --parallel "$(nproc)"
            # Declare all registered names before execution; this inventory is
            # host coverage only, not native/model qualification.
            ctest --test-dir build --show-only=json-v1 > host-ctest-registered.json
            python3 -c 'import json; from pathlib import Path; data=json.loads(Path("host-ctest-registered.json").read_text()); Path("host-ctest-expected.json").write_text(json.dumps([row["name"] for row in data["tests"]])+"\n")'
            ctest --test-dir build --parallel "$(nproc)" --output-on-failure --output-junit "$PWD/host-ctest-junit.xml"
          } 2>&1 | tee host-build.log

      - name: Preserve individual host test outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # A build failure cannot manufacture a passing empty test receipt.
          test -f host-ctest-expected.json
          test -f host-ctest-junit.xml
          python3 tools/qualification/ctest_evidence.py \
            --expected-names host-ctest-expected.json \
            --junit host-ctest-junit.xml --stage host \
            --output host-ctest-evidence.json

      # Host profile checks that the default host build does not contain: the MiniMax route-identity census
      # (STRIX_FAMILY_MINIMAX is OFF above), the generated optimization table and the other profile tests of
      # tests/engine_profile_host. They are a gate. The MiniMax source receipt goes stale with any edit under
      # MiniMax's source scope by design (it asks for a selector audit before a refresh), so its drift is
      # reported as a warning annotation with the stale paths and does not fail the job.
      - name: Host profile checks and MiniMax source receipt drift
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/engine_profile_host -B build/engine-profile-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine-profile-host --parallel "$(nproc)"
          ctest --test-dir build/engine-profile-host --parallel "$(nproc)" --output-on-failure -E '^strix-minimax-route-source-audit$'
          if ! build/engine-profile-host/strix-minimax-route-identity-tests --audit-sources > route-source-audit.log 2>&1; then
            echo "::warning title=MiniMax source receipt drift::tests/minimax_route_identity_sources.inc does not match this tree. Audit the new selectors, update the registry, then refresh the receipt."
            cat route-source-audit.log
          fi

      - name: Configure UMA host lab
        run: cmake -S lab/uma_residency -B build/uma-residency -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build UMA host lab
        run: cmake --build build/uma-residency --target strix-uma-host

      - name: Configure sparse lookup lab
        run: cmake -S lab/sparse_lookup -B build/sparse-lookup -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build sparse lookup lab
        run: cmake --build build/sparse-lookup

      - name: Configure transport lab
        run: cmake -S lab/transport -B build/transport-lab -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build transport lab
        run: cmake --build build/transport-lab

      - name: Validate dual-link runner syntax
        run: python3 -m py_compile lab/transport/dual_tbstream.py

      - name: TCP ping-pong smoke
        shell: bash
        run: |
          set -euo pipefail
          ./build/transport-lab/strix-transport-tcp server --bind 127.0.0.1 --port 19090 --max-bytes 1MiB --verify > server-ping.json &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 0.2
          ./build/transport-lab/strix-transport-tcp client --host 127.0.0.1 --port 19090 --mode pingpong --bytes 64KiB --warmup 2 --iterations 10 --verify > client-ping.json
          wait "$server_pid"
          trap - EXIT
          cat client-ping.json
          cat server-ping.json

      - name: TCP stream smoke
        shell: bash
        run: |
          set -euo pipefail
          ./build/transport-lab/strix-transport-tcp server --bind 127.0.0.1 --port 19091 --max-bytes 1MiB --verify > server-stream.json &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 0.2
          ./build/transport-lab/strix-transport-tcp client --host 127.0.0.1 --port 19091 --mode stream --bytes 256KiB --warmup 2 --iterations 10 --verify > client-stream.json
          wait "$server_pid"
          trap - EXIT
          cat client-stream.json
          cat server-stream.json

      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache-host
          key: ccache-v1-host-${{ runner.os }}-gcc-relwithdebinfo-${{ github.sha }}-${{ github.run_id }}

      - name: Upload host build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-build-log
          path: |
            host-build.log
            host-ctest-registered.json
            host-ctest-expected.json
            host-ctest-junit.xml
            host-ctest-evidence.json
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn


  hip-offline-build:
    needs: changes
    if: needs.changes.outputs.hip == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A pull request reads its own newest cache, else main's newest; its saves stay in its own scope.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache-hip
          key: ccache-v1-hip-rocm-noble-bdc8e610-${{ github.sha }}
          restore-keys: ccache-v1-hip-rocm-noble-bdc8e610-

      # The CMAKE_<LANG>_COMPILER_LAUNCHER environment variables put ccache in front of every C, C++ and HIP
      # compile of every tree below; the second root tree (Q4K-A8) shares nearly all objects with the first.
      - name: Build gfx1151 HIP labs offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ccache-hip"
          {
            image='rocm/dev-ubuntu-24.04@sha256:bdc8e61026cbb844ede93d44d2c50055f51ebb2041906b60182bf3bee3139054'
            docker pull "$image"
            docker run --rm \
              -v "$PWD:/work" \
              -v "$HOME/.ccache-hip:/ccache" \
              -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/work -e CCACHE_COMPRESS=true -e CCACHE_MAXSIZE=500M \
              -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache -e CMAKE_HIP_COMPILER_LAUNCHER=ccache \
              -w /work \
              "$image" \
              bash -lc '
                set -euo pipefail
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build hip-dev ccache
                ccache --zero-stats
                cmake -S lab/basic_kernels -B build/basic-kernels-offline -G Ninja -DCMAKE_BUILD_TYPE=Release
                cmake --build build/basic-kernels-offline
                cmake -S lab/packed_projection -B build/packed-projection-offline -G Ninja -DCMAKE_BUILD_TYPE=Release
                cmake --build build/packed-projection-offline
                cmake -S lab/uma_residency -B build/uma-residency-hip-offline -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRIX_UMA_ENABLE_HIP=ON
                cmake --build build/uma-residency-hip-offline --target strix-uma-hip

                cmake -S . -B build/root-hip-runtime-offline -G Ninja                   -DCMAKE_BUILD_TYPE=Release                   -DSTRIX_ENABLE_HIP_RUNTIME=ON                   -DBUILD_TESTING=ON
                cmake --build build/root-hip-runtime-offline                   --target strix_hip_runtime strix-hip-decode-token strix-hip-model-residency strix-hip-runtime-launchers-tests strix-hip-moe-route-launcher-tests strix-hip-embedding-launcher-tests strix-hip-hyper-mix-launcher-tests strix-hip-launcher-catalog-tests strix-hip-lm-head-launcher-tests strix-hip-shared-expert-launcher-tests strix-hip-moe-experts-launcher-tests strix-hip-gdn-launcher-tests strix-hip-ple-launcher-tests strix-hip-indexed-attention-launcher-tests strix-hip-model-residency-tests strix-hip-runtime-memory-init-tests
                cmake --build build/root-hip-runtime-offline --target strix-hip-inkling2-mini-attention-test strix-hip-inkling2-mini-short-conv-test strix-hip-inkling2-mini-grouped-test strix-hip-inkling2-mini-grouped-rows-test strix-hip-inkling2-mini-expert-activation-test strix-hip-inkling2-mini-moe-test
                cmake -S . -B build/q4k-a8-offline -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRIX_ENABLE_HIP_RUNTIME=ON -DSTRIX_ENABLE_EXPERIMENTAL_Q4K_A8_RUNTIME=ON
                cmake --build build/q4k-a8-offline --target strix_q4k_a8_hip_probe strix-hip-decode-token
                ccache --show-stats
              '
          } 2>&1 | tee hip-offline-build.log

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache-hip
          key: ccache-v1-hip-rocm-noble-bdc8e610-${{ github.sha }}-${{ github.run_id }}

      - name: Upload HIP offline build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hip-offline-build-log
          path: hip-offline-build.log
          if-no-files-found: ignore
