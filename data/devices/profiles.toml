# Built-in device profiles, in catalogue display order.
# Peaks are dense TFLOPS / TOPS; 0 = no tensor path or not stated. Fields listed in `measured`
# come from runtime observations; the other fields use vendor specifications.
schema = "strix-device-profiles-v1"

[[profiles]]
name = "rtx-pro-6000-blackwell-96"
display = "NVIDIA RTX PRO 6000 Blackwell (96 GB)"
vendor = "nvidia"
arch = "sm_120"
memory_bytes = 102641958912
memory_gbytes_ps = 1792
peaks = { fp32 = 125, fp16 = 500, bf16 = 500, fp8 = 1000, fp4 = 2000, int8 = 1000 }
units = 188
unit_kind = "SM"
pcie = { gen = 5, width = 16 }
host_link = "pcie5x16"
unified = false
measured = "memory_bytes,units"
note = "our card; memory_bytes and units read from the runtime, peaks public spec"

