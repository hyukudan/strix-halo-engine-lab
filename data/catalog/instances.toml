schema = "strix-kernel-instances-v1"
fragments = ["data/catalog/mix.toml", "src/cuda/core/select_catalog.toml", "data/catalog/cuda_decode.toml"]

# Each record expands to a key per weight ID and supported rows class
# (1, 2–8, 9–32, >32). max_rows caps a partial class. Dimensions and chain
# IDs are zero, math is native and entries are BASE in this bootstrap.
# The resolver interprets mode as a selector for the named existing launcher.
# Cost defaults to the profile roofline and workspace to site scratch.
# unpriced_single_launch and none preserve those contracts for existing launchers.

[[instance]]
id = "cuda_dense_rows"
backend = "cuda"
arch = "sm120"
op = "linear"
form = "rows"
weights = [["plain.bf16", 1], ["plain.f32", 1], ["gguf.q8_0", 1]]
act = "f32_fma"
max_rows = 32
identity = "cuda-sm120-dense-rows-fp32-v1"
source = "src/cuda/core/dense/dense.cu"
launcher = "strix::cuda_core::dense_rows"
mode = "fp32"

[[instance]]
id = "cuda_dense_rows_multi"
backend = "cuda"
arch = "sm120"
op = "linear"
form = "rows.multi"
weights = [["plain.bf16", 1], ["plain.f32", 1], ["gguf.q8_0", 1]]
act = "f32_fma"
max_rows = 32
identity = "cuda-sm120-dense-rows-multi-fp32-v1"
source = "src/cuda/core/dense/dense.cu"
launcher = "strix::cuda_core::dense_rows_multi"
mode = "fp32"

[[instance]]
id = "cuda_dense_mma"
