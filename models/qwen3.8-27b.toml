schema = "strix-model/v1"
name = "qwen3.8-27b"

# Descriptive assertions only (dense hybrid GDN + gated full attention, Qwen3_5ForConditionalGeneration text model).
# The qwen35 family (include/strix/qwen35/config.hpp) owns the GGUF contract; see docs/models/qwen3.8-27b/README.md.
[graph]
adapter = "qwen35-dense-v1"
attention_pattern = "gdn,gdn,gdn,attn"
ffn_pattern = "dense:0-63"

[dims]
hidden = 5120
layers = 64
vocab = 248320
intermediate = 17408
context = 262144

[attention]
kind = "gdn+gated-attn"

[attention.gdn]
key_heads = 16
value_heads = 48
head_dim = 128
conv_kernel = 4
value_head_order = "tiled"

[attention.full]
heads = 24
kv_heads = 4
head_dim = 256
rope_dim = 64
rope_theta = 1e7
output_gate = "sigmoid"

[extras.mtp]
layer = 64
heads = 1

[arithmetic]
rms_eps = 1e-6
l2_eps = 1e-6
norm_gain = "1+w"

[weights.format]
dense = ["iu4", "q8_0"]

[drafter]
kind = "model"

# Launchers project these columns into the engine's native, gated registry.
[presets]
default = "fast"
native_kv = "bf16"

[presets.exact]
levers = "exact"

[presets.fast]
levers = "fast"

# Use the admitted FAST levers until this model has a qualified TURBO set.
[presets.turbo]
levers = "fast"

# The CUDA dense decode route implements the E4M3 KV shadow.
[presets.exact.cuda]
kv = "native"

[presets.fast.cuda]
kv = "native"

[presets.turbo.cuda]
kv = "fp8"
