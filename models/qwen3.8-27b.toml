schema = "strix-model/v1"
name = "qwen3.8-27b"

# Descriptive assertions only (dense hybrid GDN + gated full attention, Qwen3_5ForConditionalGeneration text model).
# The qwen35 family (include/strix/qwen35/config.hpp) owns the GGUF contract; see docs/models/qwen3.8-27b/README.md.
[graph]
adapter = "qwen35-dense-v1"
attention_pattern = "gdn,gdn,gdn,attn"
ffn_pattern = "dense:0-63"

[dims]
hidden = 5120
layers = 64
vocab = 248320
intermediate = 17408
context = 262144

[attention]
kind = "gdn+gated-attn"

[attention.gdn]
key_heads = 16
value_heads = 48
head_dim = 128
conv_kernel = 4
value_head_order = "tiled"

[attention.full]
heads = 24
kv_heads = 4
head_dim = 256
rope_dim = 64
rope_theta = 1e7
output_gate = "sigmoid"

[extras.mtp]
layer = 64
heads = 1

[arithmetic]
rms_eps = 1e-6
l2_eps = 1e-6
norm_gain = "1+w"

[weights.format]
dense = ["iu4", "q8_0"]

[drafter]
kind = "model"

# Launchers project these columns into the engine's native, gated registry.
[presets]
default = "fast"
native_kv = "bf16"

[presets.exact]
levers = "exact"

[presets.fast]
levers = "fast"

[presets.turbo]
levers = "fast"

# HIP resolves TURBO itself and inherits the admitted FAST route.
[presets.turbo.hip]
levers = "turbo"

# The CUDA dense decode route implements the E4M3 KV shadow.
[presets.exact.cuda]
kv = "native"

[presets.fast.cuda]
kv = "native"

[presets.turbo.cuda]
kv = "fp8"

# Candidate defaults. The shared resolver requires TURBO quality and speed receipts for each regime.
[profile.kv_fp8]
turbo = "fp8"

[profile.decode_attn8]
turbo = "on"

[profile.dense_activation]
turbo = "on"
identity = "dense-window-fp4-fp8-v1"
attention_output = "fp8"
recurrent_output = "fp4"
ffn_down = "fp4"

[profile.drafter_window]
turbo = "15"
identity = "chain-window-15-v1"

# Engine-read switches of this model that a [multi_device] key is planned to replace (listed in the effective
# config when set; they still act inside the engine).
[multi_device.legacy_env]
STRIX_TP_F16_GATHER = "forms.tensor.wire"
STRIX_TP_SPLIT_DRAFT = "forms.tensor.draft_placement"
