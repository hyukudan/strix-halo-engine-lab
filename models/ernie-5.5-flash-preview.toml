# Checkpoint description for host inspection.
schema = "strix-model/v1"
name = "ernie-5.5-flash-preview"
license = "Apache-2.0"
architecture = "Ernie5_5_MoeForCausalLM"
model_type = "ernie5_5_moe"

[dims]
hidden = 4096
intermediate = 14336
layers = 43
max_context = 1048576
n_heads = 64
n_kv_heads = 1
head_dim = 512
vocab = 201216

[attention]
kind = "dsv4_hybrid"
compress_ratios = [128, 128, 128, 128, 128, 128, 128, -2,
                   128, 128, 128, 128, 128, 128, -2,
                   128, 128, 128, 128, 128, 128, -2,
                   128, 128, 128, 128, 128, 128, -2,
                   128, 128, 128, 128, 128, 128, -2,
                   128, 128, 128, 128, 128, 128, -2]
csa_dense_mode = true
sliding_window = 128
q_lora_rank = 1024
kv_lora_rank = 512
qk_nope_head_dim = 448
qk_rope_head_dim = 64
v_head_dim = 512
o_groups = 8
o_lora_rank = 1024
gated = true
gate_use_q_lora = true
gate_activation = "sigmoid"
qk_norm = "per_head"
rms_norm_eps = 0.000001
use_vha = true
use_attn_merger = true
use_fast_hadamard = true
add_full_attention_sink_bias = true
rope_interleave = true
rope_theta = 8000000
compress_rope_theta = 160000.0
hca_rope_type = "yarn"

[attention.mla]
kind = "mqa_dsa"
layers = [7, 14, 21, 28, 35, 42]
n_heads = 64
n_kv_heads = 64
q_lora_rank = 1024
kv_lora_rank = 512
qk_nope_head_dim = 192
qk_rope_head_dim = 64
v_head_dim = 256
split_kv_b_projection = true

[attention.indexer]
index_head_dim = 128
index_n_heads = 64
index_topk = 2048
sidecar = "flashindexer/flashindexer.safetensors"

[attention.rope_scaling]
type = "yarn"
factor = 16.0
beta_fast = 32.0
beta_slow = 1.0
original_max_position_embeddings = 65536

[moe]
first_k_dense_replace = 1
moe_layer_freq = 1
moe_intermediate_size = 2048
moe_latent_size = 2048
latent_moe_use_norm = true
moe_split_feature_routing = true
n_routed_experts = 512
num_experts_per_tok = 10
n_shared_experts = 1
moe_shared_expert_gate = false
n_group = 1
topk_group = 1
scoring_func = "sigmoid"
topk_method = "noaux_tc"
norm_topk_prob = true
routed_scaling_factor = 3.0
routed_scaling_factor_learnable = true
hidden_act = "situ"
activation_situ_beta = 4.0
activation_situ_linear_beta = 25.0

[extras]
hc_mult = 4
hc_sinkhorn_iters = 20
hc_eps = 0.000001
tie_word_embeddings = false
dspark_noise_token_id = 1024
num_nextn_predict_layers = 0

[tokens]
pad_token_id = 0
bos_token_id = 1
eos_token_id = 2

[weights.checkpoint]
container = "safetensors"
shards = 128
dense = "fp8_e4m3"
weight_block_size = [128, 128]
config_scale_format = "ue8m0"
observed_dense_scale_dtype = "F32"
experts = ["mxfp4_e2m1_ue8m0"]
expert_block_columns = 32

[drafter]
kind = "block"
block = 7
rank = 256
taps = [40, 41, 42]

[presets]
default = "exact"

[presets.exact]
levers = "exact"
