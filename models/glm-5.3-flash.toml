schema = "strix-model/v1"
name = "glm-5.3-flash"

# Descriptive assertions only. The explicit GLM adapter owns tensor mapping,
# mHC/KDA/DSA state effects, routing and compiled schedules. Identity output
# remains in engine code; this file never supplies printed identity text.
[graph]
adapter = "glm-5.3-flash-v1"
attention_pattern = "kda,kda,kda,dsa"
ffn_pattern = "dense:0-2,moe:3-44"

[dims]
hidden = 4096
layers = 45
vocab = 154880
intermediate = 12288

[attention]
kind = "kda+dsa"

[attention.kda]
heads = 64
head_dim = 128
qkv = 8192
conv_kernel = 4

[attention.mla]
q_lora = 1536
kv_lora = 512
heads = 64
head_dim = 256
rope_dim = 0

[attention.select]
heads = 32
head_dim = 128
pool = 4
top_k = 2048
pools = 512

[moe]
experts = 288
top_k = 8
intermediate = 2048
first_layer = 3
shared = 1

[moe.route]
# Router (include/strix/moe/route_policy.hpp RoutePolicy; words = its enumerator names). The engine binds
# its policy from these keys: score transform, selection bias, selection key, output order, renormalisation.
score = "sigmoid"
selection_bias = true
key = "ordered_bits"
order = "ascending_id"
renormalize = true
renorm_single = true
renorm_eps = 1e-20
scale = 2.5

[extras.hyper_connections]
rank = 4
mix = 24
iterations = 20

[extras.mtp]
layer = 45
heads = 1

[arithmetic]
rms_eps = 1e-5
hc_eps = 1e-6
l2_eps = 1e-6
ln_eps = 1e-6
gate_lower_bound = -5.0
clamp = 10.0
route_scale = 2.5
route_den_eps = 1e-20
inv_sqrt128 = 0.088388347648318
inv_sqrt32 = 0.17677669529663687
mla_scale = 0.0625

[weights.format]
dense = "exl3"
experts = "exl3"

[drafter]
kind = "model"

# Launchers project these columns into the engine's native, gated registry.
[presets]
default = "fast"
native_kv = "bf16 MLA latent"

[presets.exact]
levers = "exact"

[presets.fast]
levers = "fast"

# Use the admitted FAST levers until this model has a qualified TURBO set.
[presets.turbo]
levers = "fast"

# Engine-read switches of this model that a [multi_device] key is planned to replace (listed in the effective
# config when set; they still act inside the engine).
[multi_device.legacy_env]
STRIX_GLM_PF_PIPELINE = "forms.layers"
STRIX_GLM_PF_STAGED = "forms.layers"

# GLM-5.3 pair: 34 KDA layers split 32 + 32 heads (per rank), 11 DSA + 1 MTP layer shared on both ranks; pool = one FP32
# 128-vector per closed 4-row block.
# Prompt-state hand-off declaration (include/strix/pair/state_owners.hpp Family / Piece; words = the Owner and Extent
# enumerator names). Per layer: `bytes` per stored row (rows) or per layer (fixed), per destination slice for per_rank
# pieces; stored rows = floor((P - rows_less) / row_div). Consumer file:line in `source`.
[pair]
family = "glm-5.3"
rows_of = "P = N - 1"
world = 2
block_rows = 64
prefix_rows_invariant = false
shared_once_default = true
shared_once_source = "glm v1/v2 rank payload equal bits (host relay fixture)"
state = [
    { name = "kda_s", kind = 0, owner = "per_rank", extent = "fixed", bytes = 2097152, layers = 34, layer0 = 0, layer_stride = 1, row_div = 1, rows_less = 0, source = "src/glm/kernels/glm_tier_a.hip:153-190" },
    { name = "kda_conv", kind = 1, owner = "per_rank", extent = "fixed", bytes = 147456, layers = 34, layer0 = 0, layer_stride = 1, row_div = 1, rows_less = 0, source = "src/glm/kernels/glm_tier_a.hip:153-190" },
    { name = "dsa_latent", kind = 2, owner = "shared", extent = "rows", bytes = 1024, layers = 12, layer0 = 0, layer_stride = 1, row_div = 1, rows_less = 0, source = "src/glm/kernels/glm_dsa.hip:54-87" },
    { name = "dsa_ikey", kind = 3, owner = "shared", extent = "rows", bytes = 256, layers = 12, layer0 = 0, layer_stride = 1, row_div = 1, rows_less = 0, source = "src/glm/kernels/glm_dsa.hip:120-153" },
    { name = "dsa_igate", kind = 4, owner = "shared", extent = "rows", bytes = 256, layers = 12, layer0 = 0, layer_stride = 1, row_div = 1, rows_less = 0, source = "src/glm/kernels/glm_dsa.hip:120-153" },
    { name = "dsa_pool", kind = 5, owner = "shared", extent = "rows", bytes = 512, layers = 12, layer0 = 0, layer_stride = 1, row_div = 4, rows_less = 0, source = "src/glm/kernels/glm_dsa.hip:167-180" },
]
