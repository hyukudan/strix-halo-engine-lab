schema = "strix-model/v1"
name = "minimax-m3.1-flash"

# Descriptive template for the explicit MiniMax adapter; no runner selection.
[graph]
template = "minimax-m3.1-flash"
custom_subgraphs = ["msa-indexer", "dense-prefix", "sparse-moe"]
state_effects = ["append-kv-index", "fixed-rank-order-exchange"]

[dims]
hidden = 6144
q = 8192
kv = 512
index_q = 512
head_dim = 128
n_heads = 64
n_kv_heads = 4
index_heads = 4
layers = 60
intermediate = 12288
vocab = 200064
vocab_rank_pad = 100096

[attention]
kind = "msa"

[moe]
first_layer = 3
experts = 128
top_k = 4
intermediate = 3072

[moe.route]
# Router (include/strix/moe/route_policy.hpp RoutePolicy; words = its enumerator names). The engine binds
# its policy from these keys: score transform, selection bias, selection key, output order, renormalisation.
score = "sigmoid"
selection_bias = true
key = "float_serial"
order = "selection"
renormalize = true
renorm_single = true
renorm_eps = 1e-20
scale = 2.0

[math]
eps = 1e-6
alpha = 1.702
limit = 7.0

[weights.format]
dense = "exl3"
experts = "exl3"

[drafter]
kind = "block"
block = 7

# Launchers project these columns into the engine's native, gated registry.
[presets]
default = "fast"
native_kv = "bf16"

[presets.exact]
levers = "exact"

[presets.fast]
levers = "fast"

[presets.turbo]
levers = "turbo"

# Engine-read switches of this model that a [multi_device] key is planned to replace (listed in the effective
# config when set; they still act inside the engine).
[multi_device.legacy_env]
STRIX_SPLIT = "forms.layers"
STRIX_SPLIT_CUT = "forms.layers.cut"
STRIX_SPLIT_BLOCK = "forms.layers.window_rows"
STRIX_MM_PF_GROUP = "forms.layers.window_rows"
STRIX_MM_PF_MOE_GROUP = "forms.layers.window_rows"
STRIX_TP2_EXCHANGE_FMT = "forms.tensor.wire"

# MiniMax M3.1, TP2 (2 KV heads per rank), 60 layers; the index keys are the same bytes for both ranks (shared).
# Prompt-state hand-off declaration (include/strix/pair/state_owners.hpp Family / Piece; words = the Owner and Extent
# enumerator names). Per layer: `bytes` per stored row (rows) or per layer (fixed), per destination slice for per_rank
# pieces; stored rows = floor((P - rows_less) / row_div). Consumer file:line in `source`.
[pair]
family = "minimax-m3.1"
rows_of = "P = N - 1"
world = 2
block_rows = 64
prefix_rows_invariant = false
shared_once_default = false
shared_once_source = "opt-in pending the pair receipt"
state = [
    { name = "k", kind = 0, owner = "per_rank", extent = "rows", bytes = 512, layers = 60, layer0 = 0, layer_stride = 1, row_div = 1, rows_less = 0, source = "src/minimax/engine/engine.hip:3193-3207" },
    { name = "v", kind = 1, owner = "per_rank", extent = "rows", bytes = 512, layers = 60, layer0 = 0, layer_stride = 1, row_div = 1, rows_less = 0, source = "src/minimax/engine/engine.hip:3193-3207" },
    { name = "ik", kind = 2, owner = "shared", extent = "rows", bytes = 256, layers = 60, layer0 = 0, layer_stride = 1, row_div = 1, rows_less = 0, source = "src/minimax/rtxpf/cuda/mm_rtx_kernels.cu:639" },
]
