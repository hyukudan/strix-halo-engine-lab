schema = "strix-model/v1"
name = "inkling2-mini"

[dims]
context = 1048576
window = 1024
layers = 24
hidden = 2304
vocab = 201024
vocab_out = 200058
eos_token = 200006
head_dim = 128
heads = 24
kv_heads = 8
query_width = 3072
kv_width = 1024
relative_width = 16
relative_extent = 1024
conv_taps = 4
experts = 128
top_k = 8
ffn = 1152
rank = 64

[head]
softcap = 30.0

[moe]
mxfp8_first = 20
route_scale = 8.0
gate_softcap = 4.0
up_softcap = 25.0

[weights.format]
attention = "bf16"
head = "bf16"
dense = "bf16"
experts = ["nvfp4", "mxfp8"]

[fusion]
groups = ["qkv", "conv4.clip.kv_append"]

[schedule]
# The core repeats over [core_first, core_last), with distinct state per visit.
core_first = 6
core_last = 18
core_passes = 3
residual_block_layers = 6

# Speculation: the MTP block drafter's sidecar beside the checkpoint (strix/spec/drafter_source.hpp), and the draft
# rows per lane by live lanes of the served cohort (serve::CohortConfig::max_draft_by_live): a served window is its
# own forward, so lanes draft only while one lane is live.
[speculation]
drafter = "mtp.safetensors"
# The block-diffusion drafter (DFlash 2, src/spec/dflash_resident.hpp): a directory beside the checkpoint (config.json +
# model.safetensors). The HIP CLI resident route binds it when present and valid, beside the MTP sidecar, both under the
# shared per-regime selector, in the tiers of [speculation.block_by_default]; CUDA binds it only when named (--dflash DIR).
# Never fetched by the engine.
block_drafter = "dflash2"
max_draft_by_live = [7, 0]

# Charged re-probe episodes of the shared arbiter (include/strix/spec/probe_policy.hpp), per backend with a receipt.
# cuda: RTX CLI EXACT, 256 tokens, ids equal: code 130.2 / 131.4 tok/s vs 116.0 with the fixed interval (90.8 with
# speculation off); prose 91.3 / 91.2 vs 94.8 with speculation off (0.963). hip / cpu: no row, the fixed interval.
[speculation.probe_loss]
cuda = 0.015

# The block drafter's arm under the shared per-regime selector (include/strix/spec/arm_selector.hpp), per tier, HIP.
# by_default: the selector over both drafters is the run's default when the directory is beside the checkpoint.
# wins_ties: the block arm takes an inconclusive probe episode; declared from the tier's own device receipts (gfx1151
# CLI, one request, 255 tokens, ids equal between arms). EXACT, selector vs the MTP sidecar alone: code 53.1 -> 61.0
# tok/s, prose 29.3 -> 30.8 / 32.1. FAST (SP4 attention + head image; TURBO decodes the same image), 7 prompts (5 code, 2
# prose) x 2 repetitions: selector vs the sidecar alone geomean 1.089x with ties to the block arm (min 0.978x), 1.081x
# with ties kept by the sidecar (min 0.956x); the two declarations differ by 0.7 %, the block arm's no worse anywhere.
[speculation.block_by_default]
exact = true
fast = true
turbo = true

[speculation.block_wins_ties]
exact = true
fast = true
turbo = true

# Chat: the reasoning effort of a request that names none, one default for the command line (--messages) and the
# server (serve::inkling2_reasoning_effort); a request's own reasoning_effort overrides it. "none" = the served effort.
[chat]
reasoning_effort = "none"

# Launchers project these columns into the engine's native, gated registry.
[presets]
# The unqualified native Inkling Mini CLI runs EXACT; FAST is explicitly opt-in.
default = "exact"

[presets.exact]
levers = "exact"

[presets.fast]
levers = "fast"

# Under a preset the TURBO column of the shared engine is not forwarded off HIP (CUDA keeps the FAST levers).
[presets.turbo]
levers = "fast"

# The HIP engine resolves its TURBO column (include/strix/profiles/inkling2_mini.hpp): the FAST levers plus the
# prefill ladder rows with a measured gain (the CLI and the server select the same class per prompt).
[presets.turbo.hip]
levers = "turbo"

# Multi-device placement, resolved by the shared profile resolver (strix-serve --model inkling2-mini --device-count N, strix-router
# --description). Two whole-model nodes serve independent requests as replicas behind strix-router: each request
# runs on one node with the single-node identity. One device resolves single, exactly as before. Staged prefill
# and tensor forms are not bound for this model: a regime that uses one arrives with the declared form and its
# qualification. Only strix-router executes the replica form; each worker is a one-device launch.
[multi_device]
version = 1
default = "single"
fallback = "single"

[multi_device.forms.replica]
ranks = 2
objective = "throughput"

# Catalogue engines whose levers --all-on may turn on for this model (docs/optimizations.json "all_on" rows).
[catalogue]
engines = ["inkling2-mini"]
