schema = "strix-model/v1"
name = "inkling2-mini"

[dims]
context = 1048576
window = 1024
layers = 24
hidden = 2304
vocab = 201024
vocab_out = 200058
eos_token = 200006
head_dim = 128
heads = 24
kv_heads = 8
query_width = 3072
kv_width = 1024
relative_width = 16
relative_extent = 1024
conv_taps = 4
experts = 128
top_k = 8
ffn = 1152
rank = 64

[head]
softcap = 30.0

[moe]
mxfp8_first = 20
route_scale = 8.0
gate_softcap = 4.0
up_softcap = 25.0

[weights.format]
attention = "bf16"
head = "bf16"
dense = "bf16"
experts = ["nvfp4", "mxfp8"]

[fusion]
groups = ["qkv", "conv4.clip.kv_append"]

[schedule]
# The core repeats over [core_first, core_last), with distinct state per visit.
core_first = 6
core_last = 18
core_passes = 3
residual_block_layers = 6

# Speculation: the MTP block drafter's sidecar beside the checkpoint (strix/spec/drafter_source.hpp), and the draft
# rows per lane by live lanes of the served cohort (serve::CohortConfig::max_draft_by_live): a served window is its
# own forward, so lanes draft only while one lane is live.
[speculation]
drafter = "mtp.safetensors"
max_draft_by_live = [7, 0]

# Launchers project these columns into the engine's native, gated registry.
[presets]
# The unqualified native Inkling Mini CLI runs EXACT; FAST is explicitly opt-in.
default = "exact"

[presets.exact]
levers = "exact"

[presets.fast]
levers = "fast"

# The engine's TURBO column: a TURBO cell without its own value takes the FAST one, and explicit TURBO levers (the
# calibrated q4 decode row, STRIX_INK_LOWBIT_TURBO=1) resolve on the served route as on the command line.
[presets.turbo]
levers = "turbo"

# Multi-device placement, resolved by the shared profile resolver (strix-serve --model inkling2-mini --device-count N, strix-router
# --description). Two whole-model nodes serve independent requests as replicas behind strix-router: each request
# runs on one node with the single-node identity. One device resolves single, exactly as before. Staged prefill
# and tensor forms are not bound for this model: a regime that uses one arrives with the declared form and its
# qualification. Only strix-router executes the replica form; each worker is a one-device launch.
[multi_device]
version = 1
default = "single"
fallback = "single"

[multi_device.forms.replica]
ranks = 2
objective = "throughput"
