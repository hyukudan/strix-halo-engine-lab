schema = "strix-model/v1"
name = "inkling2-mini"

[dims]
context = 1048576
window = 1024
layers = 24
hidden = 2304
vocab = 201024
vocab_out = 200058
eos_token = 200006
head_dim = 128
heads = 24
kv_heads = 8
query_width = 3072
kv_width = 1024
relative_width = 16
relative_extent = 1024
conv_taps = 4
experts = 128
top_k = 8
ffn = 1152
rank = 64

[head]
softcap = 30.0

[moe]
mxfp8_first = 20
route_scale = 8.0
gate_softcap = 4.0
up_softcap = 25.0

[weights.format]
attention = "bf16"
head = "bf16"
dense = "bf16"
experts = ["nvfp4", "mxfp8"]

[fusion]
groups = ["qkv", "conv4.clip.kv_append"]

[schedule]
# The core repeats over [core_first, core_last), with distinct state per visit.
core_first = 6
core_last = 18
core_passes = 3
residual_block_layers = 6

# Launchers project these columns into the engine's native, gated registry.
[presets]
# The unqualified native Inkling Mini CLI runs EXACT; FAST is explicitly opt-in.
default = "exact"

[presets.exact]
levers = "exact"

[presets.fast]
levers = "fast"

# Use the admitted FAST levers until this model has a qualified TURBO set.
[presets.turbo]
levers = "fast"

# Served prefill (strix-serve --model inkling2-mini). The served identity is the incumbent (main's served bits: the
# prompt minus its final token by prefill in the forms of form_rows-row chunks, the final token by the grouped decode
# row); the identity variant "served-cli-prefill" (whole prompt by prefill in the CLI's chunks and tail rule, =
# strix-inkling2-mini --grouped-decode) runs only when requested (--identity-variant served-cli-prefill) and admitted by
# the shared profile resolver. Per backend, a device-class table (HIP gcnArchName, CUDA sm_XY) overrides
# its backend's row where a receipt measured that class. chunk 0 = the CLI's chunk (mini_prefill_schedule); a chunk
# that is a multiple of form_rows keeps the bits of either identity. decoding_rows = the piece of a chunk while another
# request decodes (cut only where every row keeps its route forms, so they never change bits); gap_ms > 0 sizes each
# piece by the decoding request's wait (pass_fixed_ms + the previous pass's cost per row + one decode round);
# decode_share = decode ms owed per prompt ms (0 = one decode round per piece).
[serve_prefill]
form_rows = 128

# HIP: alone the CLI's chunk; beside a decoding request main's busy regime on every class without a receipt: share 1,
# 256-row pieces (two of main's 128-row slices: the shortest piece the incumbent cut rule admits).
[serve_prefill.hip]
chunk = 0
decoding_rows = 256
gap_ms = 0.0
pass_fixed_ms = 0.0
decode_share = 1.0
receipt = "incumbent busy regime (main: share 1 beside a decoding request; 256-row pieces = two 128-row slices)"

# gfx1151: the measured gap row. 512-row floor pieces: the row cost that prices the next piece is learned from passes of
# at least the floor, and a shorter pass (a streaming request's own ~280-row prompt, a chunk's short last piece) is
# dominated by the fixed cost and under-prices a row (a 256-row floor let the
# next piece outgrow the 1000 ms target: inkling2-mini README, served prefill).
[serve_prefill.hip.gfx1151]
decoding_rows = 512
gap_ms = 1000.0
pass_fixed_ms = 240.0
decode_share = 0.0
receipt = "gfx1151 EXACT gap row: pieces of at least 512 rows beside a decoding request, 1000 ms target; served ids == main (incumbent) and == the CLI under --grouped-decode (served-cli-prefill@1)"

# CUDA keeps the incumbent served dispatch (128-row chunks) until an RTX receipt qualifies the CLI's 2048-row chunk
# beside a decoding request (gap and served ids); --prefill-rows 2048 opts in.
[serve_prefill.cuda]
chunk = 128
decoding_rows = 0
gap_ms = 0.0
pass_fixed_ms = 0.0
decode_share = 1.0
receipt = "incumbent served default (main: 128-row slices)"
